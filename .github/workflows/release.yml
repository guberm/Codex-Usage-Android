name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-usage-release.jks"

      - name: Test and build signed release
        env:
          CODEX_USAGE_KEYSTORE_PATH: ${{ runner.temp }}/codex-usage-release.jks
          CODEX_USAGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CODEX_USAGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CODEX_USAGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew test lint bundleRelease assembleRelease --no-daemon --max-workers=1
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab Codex-Usage-${GITHUB_REF_NAME}.aab
          cp app/build/outputs/apk/release/app-release.apk Codex-Usage-${GITHUB_REF_NAME}.apk

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Codex Usage $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "Codex-Usage-${GITHUB_REF_NAME}.aab" \
            "Codex-Usage-${GITHUB_REF_NAME}.apk" \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          path: |
            Codex-Usage-*.aab
            Codex-Usage-*.apk
