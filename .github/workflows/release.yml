name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-usage-release.jks"

      - name: Test and build signed APK
        env:
          CODEX_USAGE_KEYSTORE_PATH: ${{ runner.temp }}/codex-usage-release.jks
          CODEX_USAGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CODEX_USAGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CODEX_USAGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew test assembleRelease --no-daemon --max-workers=1
          cp app/build/outputs/apk/release/app-release.apk Codex-Usage-${GITHUB_REF_NAME}.apk

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Codex Usage $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "Codex-Usage-${GITHUB_REF_NAME}.apk" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: Codex-Usage-*.apk
